<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- IC chip body -->
  <rect x="4" y="4" width="8" height="8" rx="1" fill="#1565C0"/>
  <!-- Inner die area -->
  <rect x="5.5" y="5.5" width="5" height="5" rx="0.5" fill="#42A5F5"/>
  <!-- Cross lines suggesting circuit traces -->
  <line x1="8" y1="5.5" x2="8" y2="10.5" stroke="#1565C0" stroke-width="0.9"/>
  <line x1="5.5" y1="8" x2="10.5" y2="8" stroke="#1565C0" stroke-width="0.9"/>
  <!-- Left pins -->
  <rect x="1.5" y="5.8" width="2.2" height="1.1" rx="0.2" fill="#546E7A"/>
  <rect x="1.5" y="9.1" width="2.2" height="1.1" rx="0.2" fill="#546E7A"/>
  <!-- Right pins -->
  <rect x="12.3" y="5.8" width="2.2" height="1.1" rx="0.2" fill="#546E7A"/>
  <rect x="12.3" y="9.1" width="2.2" height="1.1" rx="0.2" fill="#546E7A"/>
  <!-- Top pins -->
  <rect x="5.8" y="1.5" width="1.1" height="2.2" rx="0.2" fill="#546E7A"/>
  <rect x="9.1" y="1.5" width="1.1" height="2.2" rx="0.2" fill="#546E7A"/>
  <!-- Bottom pins -->
  <rect x="5.8" y="12.3" width="1.1" height="2.2" rx="0.2" fill="#546E7A"/>
  <rect x="9.1" y="12.3" width="1.1" height="2.2" rx="0.2" fill="#546E7A"/>
</svg>
